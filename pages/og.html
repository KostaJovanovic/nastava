<!doctype html>
<!-- The link preview images, one per section: static/og.png (the home page and the forum's posts) and
     static/og-<section>.png (base.html block og). The address's #<section> picks one. To redo them, from pages/
     (headless Edge's own --screenshot cuts the bottom: its window size includes the browser's frame):
     uv run --with playwright python -c "from playwright.sync_api import sync_playwright as s; from pathlib import Path
     with s() as p:
      b = p.chromium.launch(channel='msedge')
      for n in ['', 'raspored', 'nastavnici', 'arhiva', 'predmeti', 'vesti']: g = b.new_page(viewport={'width': 1200, 'height': 630}); g.goto(Path('og.html').resolve().as_uri() + '#' + n); g.wait_for_timeout(300); g.screenshot(path='static/og' + ('-' + n if n else '') + '.png')" -->
<html lang="sr">
<meta charset="utf-8">
<style>
@font-face { font-family: Geist; src: url(static/fonts/Geist-Regular.woff2); font-weight: 400; }
@font-face { font-family: Geist; src: url(static/fonts/Geist-ExtraBold.woff2); font-weight: 800; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { font-family: Geist, sans-serif; color: #fff; background: #0076b1; position: relative; text-align: center; }
/* The brand's wave, large and faint, across the whole image. */
.wave { position: absolute; inset: 0; width: 100%; height: 100%; }
/* Centred, so that a square crop (Viber, WhatsApp: the middle 630px) keeps the brand whole. */
.brand { position: absolute; top: 52px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; }
.mark { width: 62px; height: 62px; }
.brand b { font-weight: 800; font-size: 62px; letter-spacing: -2px; line-height: 1; }
h1 { position: absolute; top: 146px; left: 60px; right: 60px; margin: 0; font-weight: 800; font-size: 82px; letter-spacing: -2.5px; line-height: 1; }
.sub { position: absolute; top: 246px; left: 60px; right: 60px; margin: 0; font-size: 34px; color: #e3eff7; }
.pic { position: absolute; top: 330px; left: 50%; width: 900px; height: 196px; transform: translateX(-50%); text-align: left; }
.ft { position: absolute; left: 0; right: 0; bottom: 30px; font-size: 26px; font-weight: 800; }
/* The picture's parts: white cards with grey bars for text nobody needs to read. */
.card { background: #fff; color: #536482; border-radius: 16px; box-shadow: 0 10px 30px rgb(0 0 0 / .18); box-sizing: border-box; }
.ln { display: block; height: 14px; border-radius: 7px; background: #dbe3ec; }
.row { display: flex; gap: 20px; height: 100%; }
.row > .card { flex: 1; padding: 22px; }
/* Home: the search bar and what it covers. */
.bar { display: flex; align-items: center; gap: 18px; height: 84px; padding: 0 30px; font-size: 32px; }
.bar b { margin-left: auto; font-weight: 800; color: #fff; background: #0076b1; border-radius: 9px; padding: 10px 24px; font-size: 28px; }
.chips { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
.chips span { font-size: 26px; padding: 10px 22px; border-radius: 99px; background: rgb(255 255 255 / .16); }
/* Raspored: a week. */
.week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; height: 100%; padding: 18px 22px; }
.week > div { position: relative; }
.week h3, .sem h3 { margin: 0 0 10px; font-size: 20px; font-weight: 800; color: #536482; }
.week i { position: absolute; left: 0; right: 0; border-radius: 8px; background: #0076b1; }
/* Nastavnici: people. */
.who { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
.av { flex: none; width: 64px; height: 64px; border-radius: 50%; background: #cfe3f0; position: relative; overflow: hidden; }
.av::before { content: ""; position: absolute; left: 21px; top: 12px; width: 22px; height: 22px; border-radius: 50%; background: #0076b1; }
.av::after { content: ""; position: absolute; left: 10px; top: 38px; width: 44px; height: 40px; border-radius: 50%; background: #0076b1; }
.who div { flex: 1; display: grid; gap: 10px; }
.meta { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.meta svg { flex: none; }
.gone .card { background: rgb(255 255 255 / .62); box-shadow: none; }
.gone .av { background: #e4e8ee; }
.gone .av::before, .gone .av::after { background: #9aa6b8; }
/* Predmeti: semesters. */
.sem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; height: 100%; padding: 20px 22px; }
.subj { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.subj .ln { flex: 1; }
.subj em { font-style: normal; font-size: 15px; font-weight: 800; color: #0076b1; background: #e3eff7; border-radius: 6px; padding: 3px 7px; }
/* Vesti: headlines, one of them removed by the faculty. */
.news .card { display: flex; flex-direction: column; gap: 12px; }
.news .date { width: 40%; height: 12px; background: #cfe3f0; margin-bottom: 6px; }
.news .t { height: 20px; background: #536482; opacity: .8; }
.tag { margin-top: auto; align-self: flex-start; font-size: 18px; font-weight: 800; color: #b42318; background: #fde7e4; border-radius: 6px; padding: 5px 10px; }
</style>
<svg class="wave" viewBox="0 0 1200 630" preserveAspectRatio="none" aria-hidden="true">
  <path d="M-40 560c220-330 420-330 560-110s360 220 720-160" stroke="#fff" stroke-opacity=".09" stroke-width="70" fill="none" stroke-linecap="round"/>
</svg>
<div class="brand">
  <svg class="mark" viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40"><rect width="40" height="40" fill="#fff" stroke="none"/><path d="M25 1 13 39" stroke="#000" stroke-width="5.5"/></mask><g mask="url(#cut)"><rect x="3" y="11" width="34" height="21.5" rx="6.5"/><path d="M4.8 27.8Q10 16 17.3 7.8L14 32.6M18.6 21.5Q25 12 33.4 4L26 34.5"/></g><path d="M25 1 13 39"/></svg>
  <b>nastava</b>
</div>
<h1></h1>
<p class="sub"></p>
<div class="pic"></div>
<div class="ft">masinci.org</div>

<template id="t-">
  <div class="card bar">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#536482" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    Objave, rasporedi, predmeti, nastavnici…<b>Traži</b>
  </div>
  <div class="chips"><span>Forum</span><span>Vesti</span><span>Predmeti</span><span>Nastavnici</span><span>Rasporedi</span></div>
</template>

<template id="t-raspored">
  <div class="card week">
    <div><h3>Pon</h3><i style="top:36px;height:52px"></i><i style="top:96px;height:52px;opacity:.45"></i></div>
    <div><h3>Uto</h3><i style="top:66px;height:84px;opacity:.7"></i></div>
    <div><h3>Sre</h3><i style="top:36px;height:52px;opacity:.45"></i><i style="top:96px;height:30px"></i><i style="top:132px;height:24px;opacity:.7"></i></div>
    <div><h3>Čet</h3><i style="top:36px;height:84px"></i></div>
    <div><h3>Pet</h3><i style="top:66px;height:52px;opacity:.7"></i><i style="top:126px;height:30px;opacity:.45"></i></div>
  </div>
</template>

<!-- Nastavnici and the archive share the cards; the archive's are faded. -->
<template id="t-nastavnici">
  <div class="row">
    <div class="card"><div class="who"><span class="av"></span><div><span class="ln" style="width:90%;background:#536482"></span><span class="ln" style="width:60%"></span></div></div><span class="ln" style="width:80%"></span><div class="meta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0076b1" stroke-width="2.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="ln" style="width:55%"></span></div></div>
    <div class="card"><div class="who"><span class="av"></span><div><span class="ln" style="width:75%;background:#536482"></span><span class="ln" style="width:70%"></span></div></div><span class="ln" style="width:65%"></span><div class="meta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0076b1" stroke-width="2.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="ln" style="width:70%"></span></div></div>
    <div class="card"><div class="who"><span class="av"></span><div><span class="ln" style="width:85%;background:#536482"></span><span class="ln" style="width:50%"></span></div></div><span class="ln" style="width:75%"></span><div class="meta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0076b1" stroke-width="2.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="ln" style="width:45%"></span></div></div>
  </div>
</template>

<template id="t-predmeti">
  <div class="card sem">
    <div><h3>1. semestar</h3><div class="subj"><span class="ln"></span><em>6</em></div><div class="subj"><span class="ln" style="max-width:70%"></span><em>8</em></div><div class="subj"><span class="ln"></span><em>4</em></div></div>
    <div><h3>2. semestar</h3><div class="subj"><span class="ln" style="max-width:75%"></span><em>6</em></div><div class="subj"><span class="ln"></span><em>6</em></div><div class="subj"><span class="ln" style="max-width:65%"></span><em>8</em></div></div>
    <div><h3>3. semestar</h3><div class="subj"><span class="ln"></span><em>8</em></div><div class="subj"><span class="ln" style="max-width:60%"></span><em>6</em></div><div class="subj"><span class="ln"></span><em>6</em></div></div>
    <div><h3>4. semestar</h3><div class="subj"><span class="ln" style="max-width:70%"></span><em>6</em></div><div class="subj"><span class="ln"></span><em>4</em></div><div class="subj"><span class="ln" style="max-width:75%"></span><em>8</em></div></div>
  </div>
</template>

<template id="t-vesti">
  <div class="row news">
    <div class="card"><span class="ln date"></span><span class="ln t"></span><span class="ln t" style="width:70%"></span><span class="ln" style="margin-top:8px"></span><span class="ln" style="width:85%"></span></div>
    <div class="card"><span class="ln date"></span><span class="ln t"></span><span class="ln t" style="width:55%"></span><span class="ln" style="margin-top:8px"></span><span class="ln" style="width:75%"></span></div>
    <div class="card"><span class="ln date"></span><span class="ln t" style="width:90%"></span><span class="ln t" style="width:60%"></span><span class="tag">uklonjeno sa sajta vesti</span></div>
  </div>
</template>

<script>
// Each image: its headline, the line under it and its picture's template (the archive borrows the teachers').
const pages = {
  '': ['Forum nastave i više', 'Objave od 2014, vesti, predmeti, nastavnici, rasporedi'],
  raspored: ['Kalendar i rasporedi', 'Predavanja i ispiti, sa svim ranijim verzijama'],
  nastavnici: ['Nastavnici', 'Konsultacije, kabineti i mejlovi, po katedrama'],
  arhiva: ['Arhiva nastavnika', 'Nastavnici koji više nisu na spisku fakulteta', 'nastavnici'],
  predmeti: ['Predmeti', 'Svi programi, moduli i semestri, sa ESPB'],
  vesti: ['Vesti', 'Vesti fakulteta, i one koje je fakultet uklonio'],
};
const n = location.hash.slice(1), [h, sub, pic = n] = pages[n];
document.querySelector('h1').textContent = h;
document.querySelector('.sub').textContent = sub;
document.querySelector('.pic').append(document.getElementById('t-' + pic).content.cloneNode(true));
if (n === 'arhiva') document.querySelector('.pic').classList.add('gone');
</script>
</html>
