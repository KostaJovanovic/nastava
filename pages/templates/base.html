{%- set _email = user_email | default(email | default('')) -%}
<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Pretraga{% endblock %} · arhiva</title>
<link rel="stylesheet" href="/static/style.css">
<script type="speculationrules">{"prerender": [{"where": {"href_matches": ["/item/*", "/predmet/*", "/smer/*", "/nastavnik/*"]}, "eagerness": "moderate"}]}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' fill='%23111214'/%3E%3C/svg%3E">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8"/></symbol>
  <symbol id="i-megaphone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4v7a4 4 0 0 1-4 4H4"/><path d="m9 10-5 5 5 5"/></symbol>
</svg>
<div class="page">
<a class="skip" href="#sadrzaj">Preskoči na sadržaj</a>
<header class="topbar">
  <a class="brand" href="/"><i class="brand__sq" aria-hidden="true"></i>arhiva<span>nastava</span></a>
  <form id="sf" class="cmd" action="/" method="get" role="search">
    <label class="vh" for="q">Pretraži arhivu</label>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
    <input id="q" name="q" type="search" value="{{ q | default('') }}" placeholder="Pretraži obaveštenja i dokumente" autocomplete="off" enterkeyhint="search">
    <kbd aria-hidden="true">/</kbd>
    <button class="cmd__go" type="submit">Traži</button>
  </form>
  {#- Script switch (pismo.js). data-notx: these labels stay as they are in every mode. -#}
  <div class="pismo" role="group" aria-label="Pismo" data-notx>
    <button type="button" data-pismo="lat" aria-pressed="true" aria-label="Latinica">Lat<span>inica</span></button>
    <button type="button" data-pismo="cyr" aria-pressed="false" aria-label="Ћирилица">Ћир<span>илица</span></button>
    <button type="button" data-pismo="orig" aria-pressed="false" aria-label="Originalno">Orig<span>inalno</span></button>
  </div>
</header>
<div class="frame">
{% include "sidebar.html" %}
<main class="main" id="sadrzaj">
{% block main %}{% endblock %}
</main>
</div>
</div>
<script src="/static/pismo.js"></script>
<script src="/static/site.js"></script>
</body>
</html>
