name = "nastava"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# The Worker has no static assets: GitHub Pages serves the site; the board's files link to the faculty's site, and
# the mails' and Teams files come from the release "mail" (/files/).
# The site is masinci.org; the other two only redirect there (src/index.js).
routes = [
  { pattern = "masinci.org", custom_domain = true },
  { pattern = "nastava.valjdakosta.com", custom_domain = true },
  { pattern = "nastava.masinci.org", custom_domain = true }
]

# The automatic update, every 4 hours (src/index.js dispatch starts sync.yml): 2, 6, 10, 14, 18 and 22 h in Belgrade in
# winter, an hour later in summer. Once: npx wrangler secret put GH_TOKEN, a fine-grained GitHub token for this repo
# with Actions read and write.
[triggers]
crons = ["0 1,5,9,13,17,21 * * *"]

# The web push subscriptions (src/index.js). Once: npx wrangler kv namespace create PUSH, and its id here; then
# npx wrangler secret put PUSH_KEY, with the "key" of push-secret.json (uv run ci/push.py keys).
# Last in the file: a TOML table takes every key under it.
[[kv_namespaces]]
binding = "PUSH"
id = "6fb27ef7a0ec47eaab4cbf6e284be04e"

# The visitor counter (src/index.js visit). Once: npx wrangler d1 create nastava, and its id here; then
# npx wrangler d1 execute nastava --remote --file schema.sql.
[[d1_databases]]
binding = "DB"
database_name = "nastava"
database_id = "26164f34-f23f-4b8b-ab4f-326fbd6abe8c"
