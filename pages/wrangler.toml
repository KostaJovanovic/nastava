name = "nastava"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# GitHub Pages serves the site; every file links to where it was published (docs/PLAN-pravno.md 1).
# Secrets (npx wrangler secret put <name>): GH_TOKEN and PUSH_KEY (below); the contact form's TURNSTILE_SECRET,
# INBOX_PASSWORD (/kontakt/poruke/), VAPID_PRIVATE (push-secret.json's "vapid") and INBOX_PUSH (your browser's push
# endpoint, which the inbox page shows); COUNTER_SALT (any long random string: the visitor counter's hash).
# Static assets: the teachers' photos (/foto/) of the last build, which build.py's .assetsignore keeps alone (the
# whole site is over the free plan's 20,000 files). Cloudflare serves them without running the Worker, so they do not
# count toward its 100,000 requests a day. A photo not among them (a build newer than this deploy) goes to the Worker,
# which gets it from GitHub Pages as before. So build first: wrangler deploy needs .build/site.
assets = { directory = ".build/site" }

# The site is masinci.org; the other two only redirect there (src/index.js).
routes = [
  { pattern = "masinci.org", custom_domain = true },
  { pattern = "nastava.valjdakosta.com", custom_domain = true },
  { pattern = "nastava.masinci.org", custom_domain = true },
  { pattern = "www.masinci.org", custom_domain = true }
]

# The automatic update (src/index.js dispatch starts sync.yml): 7:17, 11:17, 15:17, 19:17 and 22:17 in Belgrade in
# winter, an hour later in summer. Once: npx wrangler secret put GH_TOKEN, a fine-grained GitHub token for this repo
# with Actions read and write.
[triggers]
crons = ["17 6,10,14,18,21 * * *"]

# The web push subscriptions (src/index.js). Once: npx wrangler kv namespace create PUSH, and its id here; then
# npx wrangler secret put PUSH_KEY, with the "key" of push-secret.json (uv run ci/push.py keys).
# Last in the file: a TOML table takes every key under it.
[[kv_namespaces]]
binding = "PUSH"
id = "6fb27ef7a0ec47eaab4cbf6e284be04e"

# The visitor counter (src/index.js visit). Once: npx wrangler d1 create nastava, and its id here; then
# npx wrangler d1 execute nastava --remote --file schema.sql.
[[d1_databases]]
binding = "DB"
database_name = "nastava"
database_id = "26164f34-f23f-4b8b-ab4f-326fbd6abe8c"
