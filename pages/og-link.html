<!doctype html>
<!-- The link preview images of Linkovi's featured cards (link.html): static/og-link-<name>.png, each drawn after
     that site's own look. The address's #<name> picks one. Its fonts are in og-fonts/ (not deployed: only these images
     use them); masinci.org's logo comes from the site. To redo them, from pages/:
     uv run --with playwright python -c "from playwright.sync_api import sync_playwright as s; from pathlib import Path
     with s() as p:
      b = p.chromium.launch(channel='msedge')
      for n in ['drajv', 'webmail', 'estudent', 'masinci']: g = b.new_page(viewport={'width': 1200, 'height': 630}); g.goto(Path('og-link.html').resolve().as_uri() + '#' + n); g.wait_for_timeout(1500); g.screenshot(path='static/og-link-' + n + '.png')" -->
<html lang="sr">
<meta charset="utf-8">
<style>
/* Golos Text: Google Fonts' latin part; Masinci and Roboto Mono: masinci.org's. */
@font-face { font-family: "Golos Text"; font-weight: 800; src: url(og-fonts/GolosText-ExtraBold.woff2); }
@font-face { font-family: Masinci; src: url(og-fonts/Masinci-Regular.woff2); }
@font-face { font-family: RobotoMono; src: url(og-fonts/RobotoMono-Regular.woff2); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
section { display: none; position: relative; width: 1200px; height: 630px; overflow: hidden; text-align: center; }
section:target { display: block; }

/* Veliki drajv: a white sky of OneDrive's clouds, one big one near on the right, the far ones small, faint and soft;
   the name on the left, in the middle of the height (Golos Text, from Google Fonts). */
#drajv { background: #fff; font-family: "Segoe UI", sans-serif; color: #242424; text-align: left; }
#drajv .c { position: absolute; }
#drajv .far { opacity: .22; filter: blur(2px); }
#drajv .mid { opacity: .5; filter: blur(.6px); }
#drajv .big { filter: drop-shadow(0 34px 40px rgb(3 100 184 / .28)); }
/* A white haze behind the words, so the clouds behind them don't fight them. */
#drajv .haze { position: absolute; left: 10px; width: 640px; top: 150px; height: 330px; border-radius: 50%; background: #fff; filter: blur(34px); }
#drajv h1 { position: absolute; left: 72px; top: 50%; margin: 0; transform: translateY(-50%); font: 800 104px/1 "Golos Text", sans-serif; letter-spacing: -4px; color: #111; }
#drajv .od { position: absolute; left: 72px; bottom: 42px; display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 600; color: #616161; }

/* Webmail: RainLoop's sign-in, on its grey of circles. */
#webmail { background: #4b535d; font-family: Arial, sans-serif; color: #fff; }
#webmail h1 { position: absolute; top: 58px; left: 0; right: 0; margin: 0; font-size: 72px; font-weight: 700; letter-spacing: -1px; }
.login { position: absolute; top: 170px; left: 50%; width: 470px; transform: translateX(-50%); box-sizing: border-box; padding: 40px; background: #25292e; border-radius: 6px; box-shadow: 0 10px 40px rgb(0 0 0 / .3); text-align: left; }
.login span { display: flex; justify-content: space-between; align-items: center; height: 54px; margin-bottom: 24px; padding: 0 16px; border: 1px solid #c8ccd0; border-radius: 3px; font-size: 24px; }
.login span svg { opacity: .8; }
.login b { display: block; height: 46px; border: 1px solid #c8ccd0; border-radius: 3px; font-size: 17px; line-height: 46px; text-align: center; letter-spacing: .5px; }
#webmail .ft { position: absolute; left: 0; right: 0; bottom: 34px; font-size: 26px; color: #c8ccd0; }

/* studenti.mas: the faculty's Studentski servis, Bootstrap's grey header and plain form. */
#estudent { background: #fff; font-family: "Helvetica Neue", Arial, sans-serif; color: #333; text-align: left; }
.hd { height: 96px; padding: 0 36px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(#fff, #f6f6f6); box-shadow: 0 2px 6px rgb(0 0 0 / .1); color: #777; }
.hd div { display: grid; gap: 2px; }
.hd small { font-size: 22px; }
.hd big { font-size: 30px; }
.hd nav { display: flex; gap: 36px; font-size: 22px; }
.side { position: absolute; top: 96px; left: 0; width: 230px; height: 70px; padding: 0 32px; box-sizing: border-box; background: #f5f5f5; color: #777; font-size: 22px; line-height: 70px; }
#estudent h1 { position: absolute; top: 140px; left: 300px; margin: 0; font-size: 86px; font-weight: 400; letter-spacing: -1px; }
.form { position: absolute; top: 290px; left: 300px; display: grid; grid-template-columns: 300px 300px; gap: 22px 28px; align-items: center; }
.form label { font-weight: 700; font-size: 23px; text-align: right; line-height: 1.25; }
.form i { height: 52px; border: 1px solid #ccc; border-radius: 5px; }
.form i.on { border-color: #66afe9; box-shadow: 0 0 10px rgb(102 175 233 / .6); }
.form b { grid-column: 2; justify-self: start; padding: 11px 20px; border: 1px solid #ccc; border-radius: 5px; background: linear-gradient(#fff, #e0e0e0); font-weight: 400; font-size: 22px; }
#estudent .ft { position: absolute; left: 300px; bottom: 40px; font-size: 26px; color: #337ab7; }

/* Mašinci: the home page's hero, the logo and the hand-drawn letters on the night grid. */
#masinci { color: #f0ebe7; font-family: Masinci, sans-serif;
  background: linear-gradient(#0d2c4a55 1px, transparent 1px) 0 0 / 60px 60px, linear-gradient(90deg, #0d2c4a55 1px, transparent 1px) 0 0 / 60px 60px, #011321; }
#masinci img { position: absolute; top: 44px; left: 50%; width: 180px; height: 180px; transform: translateX(-50%); border-radius: 50%; box-shadow: 0 0 50px rgb(142 9 38 / .45); }
#masinci h1 { position: absolute; top: 250px; left: 0; right: 0; margin: 0; font-weight: 400; font-size: 92px; line-height: 1.05; }
#masinci hr { position: absolute; top: 470px; left: 50%; width: 110px; margin: 0 0 0 -55px; border: 0; border-top: 3px solid #8e0926; }
#masinci .ft { position: absolute; left: 0; right: 0; bottom: 70px; font: 30px RobotoMono, monospace; letter-spacing: 6px; color: #5a7a93; }
</style>
