<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: gear hero</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f5f7fa; color: #28313f; }
  .hero { position: relative; height: 70vh; min-height: 380px; overflow: hidden; background: #fff; border-bottom: 1px solid #cadceb; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero-text { position: relative; padding: 12vh 6vw 0; max-width: 40rem; }
  .hero-text h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 5vw, 3.5rem); color: #0076b1; }
  .hero-text p { margin: 0; font-size: 1.15rem; color: #536482; }
  main { padding: 2rem 6vw; }
</style>
</head>
<body>
<section class="hero">
  <canvas id="gears" aria-hidden="true"></canvas>
  <div class="hero-text">
    <h1>Mašinski fakultet</h1>
    <p>Arhiva nastave: predmeti, katedre, raspored.</p>
  </div>
</section>
<main><p>Ostatak stranice…</p></main>

<script>
const STEP = 6;          // px between dots
const DOT = 1.8;         // dot radius, px
const COLOR = '#0076b1'; // --head blue
const TURN_SECONDS = 40; // big gear, one full turn

const canvas = document.getElementById('gears');
const ctx = canvas.getContext('2d');
// Mask is drawn at one pixel per dot; its alpha decides each dot's size.
const mask = document.createElement('canvas');
const mctx = mask.getContext('2d', { willReadFrequently: true });
let cols, rows, dpr;

function gearPath(c, teeth, rOuter, rRoot, rHole) {
  // Body disc + straight-sided rectangular teeth, all clockwise; the hole runs
  // counter-clockwise so nonzero fill punches it out despite the overlaps.
  c.beginPath();
  c.arc(0, 0, rRoot, 0, Math.PI * 2);
  const half = Math.PI * rRoot / teeth * .85;           // half tooth width, px
  const r0 = Math.sqrt(rRoot ** 2 - half ** 2) * .95;  // corners start inside the body: no seam
  for (let i = 0; i < teeth; i++) {
    const a = i * Math.PI * 2 / teeth, cos = Math.cos(a), sin = Math.sin(a);
    const pt = (r, s) => [cos * r - sin * s, sin * r + cos * s];
    c.moveTo(...pt(r0, -half));
    c.lineTo(...pt(rOuter, -half));
    c.lineTo(...pt(rOuter, half));
    c.lineTo(...pt(r0, half));
    c.closePath();
  }
  c.moveTo(rHole, 0);
  c.arc(0, 0, rHole, 0, Math.PI * 2, true);
}

function drawGear(x, y, r, teeth, angle) {
  mctx.save();
  mctx.translate(x, y);
  mctx.rotate(angle);
  gearPath(mctx, teeth, r, r * .7, r * .2);
  mctx.fill('nonzero');
  mctx.restore();
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  const { width, height } = canvas.getBoundingClientRect();
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  cols = Math.ceil(width / STEP);
  rows = Math.ceil(height / STEP);
  mask.width = cols;
  mask.height = rows;
}

function frame(t) {
  const a = (t / 1000) / TURN_SECONDS * Math.PI * 2;
  const big = { teeth: 10, r: rows * .75 };
  const small = { teeth: 6, r: rows * .38 };

  mctx.clearRect(0, 0, cols, rows);
  mctx.fillStyle = '#000';
  drawGear(cols - big.r * .55, rows - big.r * .35, big.r, big.teeth, a);
  // Small gear turns the other way at the tooth ratio, as if meshed.
  drawGear(small.r * .7, rows - small.r * .3, small.r, small.teeth, -a * big.teeth / small.teeth);

  const px = mctx.getImageData(0, 0, cols, rows).data;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cols * STEP, rows * STEP);
  ctx.fillStyle = COLOR;
  ctx.beginPath();
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const alpha = px[(y * cols + x) * 4 + 3] / 255;
      if (alpha < .5) continue; // off the gear: hidden
      const cx = x * STEP + STEP / 2, cy = y * STEP + STEP / 2;
      ctx.moveTo(cx + DOT, cy);
      ctx.arc(cx, cy, DOT, 0, Math.PI * 2);
    }
  }
  ctx.globalAlpha = .55; // keep it a background, text stays readable
  ctx.fill();
  if (!still) requestAnimationFrame(frame);
}

const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
resize();
addEventListener('resize', () => { resize(); if (still) frame(0); });
requestAnimationFrame(frame);
</script>
</body>
</html>
