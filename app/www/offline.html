<!doctype html>
<!-- What the app shows when masinci.org doesn't load (capacitor.config.json server.errorPath; no connection only,
     MainActivity): the site's header, font, colours and button (pages/static/style.css), on its own, as nothing of
     the site loads; over a faint meadow. -->
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mašinci</title>
<style>
  @font-face { font-family: "IBM Plex Sans"; src: url("fonts/IBMPlexSans.woff2") format("woff2"); font-weight: 400 700; }
  :root { color-scheme: light dark; --sat: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    --head: light-dark(#0076b1, #011321); --paper: light-dark(#f5f7fa, #010c15); --card: light-dark(#ffffff, #061826);
    --line: light-dark(#cadceb, #21394b); --text: light-dark(#333333, #dcd6d1); --red: light-dark(#bc2a4d, #8e0926);
    --wave: light-dark(#ffffff, #8e0926); --meadow: light-dark(#0076b1, #5a7a93); }
  body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr; background: var(--paper);
    color: var(--text); font: 400 16px/1.5 "IBM Plex Sans", system-ui, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: calc(8px + var(--sat)) 16px 8px; min-height: 45px;
    background: var(--head); color: #fff; }
  header svg { width: 34px; height: 34px; fill: none; stroke: light-dark(#ffffff, #5a7a93); stroke-width: 2.5;
    stroke-linecap: round; stroke-linejoin: round; }
  header .brand__m { stroke: var(--wave); }
  header b { font-size: 20px; font-weight: 800; letter-spacing: .01em; }
  /* In the middle of the screen, not of the space under the header. */
  main { position: fixed; z-index: 1; top: 50%; left: 50%; translate: -50% -50%; display: grid; gap: 16px;
    width: min(26rem, calc(100% - 32px)); box-sizing: border-box; padding: 20px; text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  p { margin: 0; }
  a { justify-self: center; display: inline-flex; align-items: center; min-height: 38px; padding: 0 14px;
    border-radius: 8px; background: var(--red); color: #fff; font-size: 14px; text-decoration: none; }
  .meadow { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 42vh; color: var(--meadow); opacity: .16; }
  .meadow .petal { fill: var(--paper); }
  /* The sky over it: clouds, and the sun or the moon with the phone's light or dark mode. */
  .sky { position: fixed; left: 0; right: 0; top: calc(61px + var(--sat)); width: 100%; height: auto; color: var(--meadow); opacity: .16; }
  .moon { display: none; }
  @media (prefers-color-scheme: dark) { .sun { display: none; } .moon { display: inline; } }
</style>
</head>
<body>
<header><svg aria-hidden="true" viewBox="0 0 40 40"><mask id="mark-s" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40"><rect width="40" height="40" fill="#fff"/><path class="brand__cut-d" d="M25 1 13 39" stroke="#000" stroke-width="3.0" fill="none"/></mask><mask id="mark-h" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40"><rect width="40" height="40" fill="#fff"/><path class="brand__cut-m" d="M4 29.6L4.8 27.8Q10 16 17.3 7.8L15.5 30Q24 14 33.4 4L26 34.5" stroke="#000" stroke-width="4.0" fill="none"/><path class="brand__cut-d" d="M25 1 13 39" stroke="#000" stroke-width="3.0" fill="none"/></mask><mask id="mark-m" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40"><rect width="40" height="40" fill="#fff"/><path class="brand__cut-m" d="M4 29.6L4.8 27.8Q10 16 17.3 7.8L15.5 30Q24 14 33.4 4L26 34.5" stroke="#000" stroke-width="4.0" fill="none"/></mask><mask id="mark-x" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40"><rect width="40" height="40" fill="#fff"/><path d="M3 21V26a6.5 6.5 0 0 0 6.5 6.5" stroke="#000" stroke-width="3.0" fill="none"/></mask><rect class="brand__ring" x="3" y="11" width="34" height="21.5" rx="6.5" stroke-width="1.5" mask="url(#mark-s)"/><path class="brand__h" d="M.8 21.6H39.2" stroke-width="1.5" mask="url(#mark-h)"/><path class="brand__d" d="M25 1 13 39" stroke-width="1.5" mask="url(#mark-m)"/><path class="brand__m" d="M4 29.6L4.8 27.8Q10 16 17.3 7.8L15.5 30Q24 14 33.4 4L26 34.5" mask="url(#mark-x)"/></svg><b>masinci.org</b></header>
<main>
  <p>Nema interneta, ili sajt trenutno nije dostupan.</p>
  <a href="https://masinci.org/" onclick="if (history.length > 1) { event.preventDefault(); history.back(); }">Pokušaj ponovo</a>
</main>
<svg class="sky" viewBox="0 0 300 130" aria-hidden="true">
  <defs>
    <path id="cloud" fill="currentColor" d="M0 0h56a11 11 0 0 0 0-22a15 15 0 0 0-27-9a12 12 0 0 0-21 8a12 12 0 0 0-8 23z"/>
    <mask id="crescent"><rect x="200" y="10" width="80" height="80" fill="#fff"/><circle cx="252" cy="42" r="18"/></mask>
  </defs>
  <g class="sun">
    <circle cx="240" cy="50" r="16" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <path d="M240 24v-7M240 76v7M214 50h-7M266 50h7M222 32l-5-5M258 68l5 5M222 68l-5 5M258 32l5-5"/>
    </g>
  </g>
  <g class="moon" fill="currentColor">
    <circle cx="240" cy="50" r="18" mask="url(#crescent)"/>
    <circle cx="196" cy="28" r="1.4"/><circle cx="282" cy="92" r="1.2"/><circle cx="160" cy="58" r="1.1"/>
    <circle cx="276" cy="20" r="1.3"/><circle cx="40" cy="30" r="1.2"/>
  </g>
  <use href="#cloud" transform="translate(16 80)"/>
  <use href="#cloud" transform="translate(84 118) scale(.65)"/>
  <use href="#cloud" transform="translate(146 106) scale(.8)" opacity=".7"/>
</svg>
<svg class="meadow" viewBox="0 0 400 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <g id="tuft" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M0 0q-1-9-5-15M0 0q1-11 2-19M0 0q3-8 8-13M0 0q-3-6-9-9"/>
    </g>
    <g id="daisy">
      <path d="M0 0q-2-12 1-24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M0 -10q5-4 9-2q-4 4-9 2" fill="currentColor"/>
      <g transform="translate(1 -24)">
        <g fill="currentColor"><ellipse rx="2" ry="4.5" cy="-4"/><ellipse rx="2" ry="4.5" cy="-4" transform="rotate(72)"/>
          <ellipse rx="2" ry="4.5" cy="-4" transform="rotate(144)"/><ellipse rx="2" ry="4.5" cy="-4" transform="rotate(216)"/>
          <ellipse rx="2" ry="4.5" cy="-4" transform="rotate(288)"/></g>
        <circle r="2.2" class="petal"/>
      </g>
    </g>
  </defs>
  <path fill="currentColor" opacity=".35" d="M0 110Q70 70 150 92T300 80T400 88V220H0Z"/>
  <path fill="currentColor" opacity=".6" d="M0 140Q90 100 200 124T400 112V220H0Z"/>
  <path fill="currentColor" d="M0 172Q120 136 250 160T400 150V220H0Z"/>
  <g opacity=".6">
    <use href="#tuft" x="30" y="118"/><use href="#tuft" x="120" y="112"/><use href="#tuft" x="236" y="122"/>
    <use href="#tuft" x="330" y="114"/><use href="#daisy" x="170" y="117"/><use href="#daisy" x="300" y="116"/>
  </g>
  <use href="#tuft" x="20" y="166"/><use href="#tuft" x="96" y="154"/><use href="#tuft" x="190" y="156"/>
  <use href="#tuft" x="282" y="158"/><use href="#tuft" x="372" y="151"/>
  <use href="#daisy" x="56" y="160"/><use href="#daisy" x="146" y="152"/><use href="#daisy" x="236" y="158"/>
  <use href="#daisy" x="350" y="152"/>
</svg>
</body>
</html>
