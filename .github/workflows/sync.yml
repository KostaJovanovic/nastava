name: sync

# The automatic update: the same chain as on the PC (ci/deploy.sh): get the state, scrape, save the state, build,
# publish through deploy.yml, then the web push. Every 2 hours by day only the board (ci/deploy.sh forum); once a week
# also the schedule pages, the teachers and the subjects (ci/deploy.sh sync). A failure makes the run red (an e-mail).
# GitHub may start a scheduled run late, and turns the schedule off after 60 days without a commit.
on:
  schedule:
    - cron: "17 5-21/2 * * *"  # 05:17–21:17 UTC: 06–22 in Belgrade in winter, 07–23 in summer (the board's hours)
    - cron: "47 2 * * 1"       # Monday night: everything
  workflow_dispatch:
    inputs:
      what:
        description: "forum: only the board; sync: also the schedules, the teachers and the subjects"
        type: choice
        options: [forum, sync]
        default: forum

permissions:
  contents: write  # the state and site releases
  actions: write   # ci/deploy.sh starts deploy.yml

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      WHAT: ${{ github.event.schedule == '47 2 * * 1' && 'sync' || inputs.what || 'forum' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/*.py"
      # push-secret.json (ci/push.py keys) as the repository secret PUSH_SECRET; without it there is no web push.
      - name: Get the web push keys
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: if [[ -n $PUSH_SECRET ]]; then printf '%s' "$PUSH_SECRET" > push-secret.json; fi
      - name: Scrape, build, publish, notify
        run: bash ci/deploy.sh "$WHAT"
