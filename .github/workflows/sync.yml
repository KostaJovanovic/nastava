name: sync

# The automatic update. Five runs a day (7:17 to 22:17 in Belgrade), each scraping the board and the news; ci/plan.py (through
# ci/deploy.sh auto) adds to the morning run the schedule pages on the 1st of the month and on the first day of a
# registration or an exam period (from the faculty's teaching calendar), and the teachers and the subjects on 1 October.
# The Worker's cron starts them (pages/wrangler.toml, src/index.js dispatch): GitHub's own schedule started runs 5–8
# hours late.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "forum: the board and the news; sync: every scraper; auto: as a scheduled run"
        type: choice
        options: ["forum", "forum studije", "sync", "auto morning", "auto noon", "auto afternoon", "auto evening", "auto late"]
        default: forum

permissions:
  contents: write  # the state and site releases
  actions: write   # ci/deploy.sh starts deploy.yml

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      WHAT: ${{ inputs.what }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/*.py"
      # push-secret.json (ci/push.py keys) as the repository secret PUSH_SECRET; without it there is no web push.
      # fcm-secret.json (Firebase's service account key) as FCM_SECRET: the Android app's notifications.
      - name: Get the web push keys
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          FCM_SECRET: ${{ secrets.FCM_SECRET }}
        run: |
          if [[ -n $PUSH_SECRET ]]; then printf '%s' "$PUSH_SECRET" > push-secret.json; fi
          if [[ -n $FCM_SECRET ]]; then printf '%s' "$FCM_SECRET" > fcm-secret.json; fi
      # The board (nastava.mas.bg.ac.rs) answers GitHub's servers 403 since 2026-11-18: its requests go through
      # Cloudflare WARP's local SOCKS proxy (common.py session, FORUM_PROXY), every other request goes direct. When WARP
      # does not come up, FORUM_PROXY stays unset and the run goes on as before (the board's steps fail, the rest runs).
      - name: Connect Cloudflare WARP for the board
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for _ in $(seq 30); do warp-cli --accept-tos status | grep -q Connected && break; sleep 1; done
          curl -fsS -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp='
          echo "board: $(curl -s -o /dev/null -w '%{http_code}' -x socks5h://127.0.0.1:40000 -A 'Mozilla/5.0 (personal archive)' https://nastava.mas.bg.ac.rs/nastava/index.php)"
          echo "FORUM_PROXY=socks5h://127.0.0.1:40000" >> "$GITHUB_ENV"
      - name: Scrape, build, publish, notify
        # Unquoted: the words are the arguments (the input is one of the choices above).
        run: bash ci/deploy.sh $WHAT
