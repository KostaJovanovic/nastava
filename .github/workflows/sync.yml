name: sync

# The automatic update. Five runs a day (7:17 to 22:17 in Belgrade), each scraping the board and the news; ci/plan.py (through
# ci/deploy.sh auto) adds to the morning run the schedule pages on the 1st of the month and on the first day of a
# registration or an exam period (from the faculty's teaching calendar), and the teachers and the subjects on 1 October.
# The Worker's cron starts them (pages/wrangler.toml, src/index.js dispatch): GitHub's own schedule started runs 5–8
# hours late.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "forum: the board and the news; sync: every scraper; auto: as a scheduled run"
        type: choice
        options: ["forum", "forum studije", "sync", "auto morning", "auto noon", "auto afternoon", "auto evening", "auto late"]
        default: forum

permissions:
  contents: write  # the state and site releases
  actions: write   # ci/deploy.sh starts deploy.yml

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      WHAT: ${{ inputs.what }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/*.py"
      # push-secret.json (ci/push.py keys) as the repository secret PUSH_SECRET; without it there is no web push.
      - name: Get the web push keys
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: if [[ -n $PUSH_SECRET ]]; then printf '%s' "$PUSH_SECRET" > push-secret.json; fi
      - name: Scrape, build, publish, notify
        # Unquoted: the words are the arguments (the input is one of the choices above).
        run: bash ci/deploy.sh $WHAT
